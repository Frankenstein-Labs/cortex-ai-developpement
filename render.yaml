services:
  - type: web
    name: cortex-cloud-control
    runtime: docker
    plan: free
    dockerfilePath: ./apps/cloud-control/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: CORTEX_ENVIRONMENT
        value: production
      - key: CORTEX_DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://ownnbyhsflmdjytwaeqv.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: CORTEX_COOKIE_SECURE
      - key: CORTEX_ALLOWED_ORIGINS
        sync: false
        value: https://cortex-ai-developpement-market-git-db6a4c-18s-projects-030c6a8a.vercel.app
